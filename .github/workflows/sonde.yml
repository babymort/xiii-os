name: Sonde paquets
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/sonde.yml', 'config/includes.chroot/usr/lib/xiii/xiii/ltc.py']
jobs:
  sonde:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          sed -i 's/^Components: main$/Components: main contrib non-free/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          for p in labwc grim libltc11 python3-numpy v4l2loopback-dkms v4l2loopback-utils gstreamer1.0-plugins-bad fonts-orbitron fonts-press-start-2p fonts-courier-prime gnome-sushi tumbler ffmpegthumbnailer poppler-utils python3-gi-cairo; do
            v=$(apt-cache policy $p | awk '/Candidat|Candidate/{print $2}'); echo "$p => ${v:-ABSENT}"; done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq labwc grim gstreamer1.0-plugins-bad libltc11 >/dev/null 2>&1
          labwc --version; grim -h 2>&1 | head -20
          strings /usr/bin/labwc | grep -iE "image_copy_capture|image_capture_source|foreign_toplevel_list|screencopy" | sort -u | head
          find / -name "libgstdecklink*" 2>/dev/null | head; ls /usr/lib/x86_64-linux-gnu/libltc* 2>/dev/null
  test-ltc:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libltc11 python3 python3-gi gir1.2-gtk-4.0 >/dev/null
          cd config/includes.chroot/usr/lib/xiii && python3 -c "
          import sys; sys.argv=['x','--test']
          from xiii import ltc; ltc.main()"
