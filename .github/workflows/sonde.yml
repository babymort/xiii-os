name: Sonde paquets
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/sonde.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          sed -i 's/^Components: main$/Components: main contrib non-free/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          for p in retroarch libretro-nestopia libretro-snes9x libretro-mgba libretro-gambatte libretro-genesisplusgx libretro-desmume libretro-beetle-pce-fast libretro-beetle-psx libretro-beetle-vb libretro-beetle-wswan libretro-bsnes-mercury-balanced libretro-mupen64plus libretro-core-info mupen64plus-ui-console mupen64plus-qt dolphin-emu ppsspp ppsspp-sdl mednafen mame stella dosbox dosbox-staging scummvm fs-uae openmsx vice hatari melonds desmume flycast pcsx2 duckstation azahar xemu fbneo libretro-fbneo atari800 fuse-emulator-gtk yabause mgba-qt snes9x-gtk nestopia flatpak gnome-software-plugin-flatpak; do
            v=$(apt-cache policy $p | awk '/Candidat|Candidate/{print $2}'); echo "$p => ${v:-ABSENT}"; done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq labwc grim gstreamer1.0-plugins-bad libltc11 >/dev/null 2>&1
          labwc --version; grim -h 2>&1 | head -20
          strings /usr/bin/labwc | grep -iE "image_copy_capture|image_capture_source|foreign_toplevel_list|screencopy" | sort -u | head
          find / -name "libgstdecklink*" 2>/dev/null | head; ls /usr/lib/x86_64-linux-gnu/libltc* 2>/dev/null
  test-ltc:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libltc11 python3 python3-gi gir1.2-gtk-4.0 >/dev/null
          cd config/includes.chroot/usr/lib/xiii && python3 -c "
          import sys; sys.argv=['x','--test']
          from xiii import ltc; ltc.main()"
