name: Sonde paquets
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/sonde.yml']
jobs:
  sonde:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          sed -i 's/^Components: main$/Components: main contrib non-free/' /etc/apt/sources.list.d/debian.sources
          dpkg --add-architecture i386
          apt-get update -qq
          for p in calamares calamares-settings-debian qt6-wayland wine wine32:i386 wine64 winetricks icoutils cabextract fonts-wine libwine:i386 gamemode umu-launcher; do
            v=$(apt-cache policy $p | awk '/Candidat|Candidate/{print $2}'); echo "$p => ${v:-ABSENT}"; done
          apt-get download calamares-settings-debian >/dev/null 2>&1 && dpkg -c calamares-settings-debian*.deb | awk '{print $6}' | grep -vE '/$' | head -60
          dpkg -I calamares-settings-debian*.deb | grep -i depends
# v3
