name: Vérification ZZ (fin de saison)
# Lance le bureau XIII sur un écran virtuel (labwc headless) et prend des captures de chaque panneau.
on:
  push:
    branches: [beta]
    paths: ['tests/zz.sh', '.github/workflows/zz.yml', 'config/includes.chroot/usr/lib/xiii/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zz:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Paquets
        run: |
          sed -i 's/^Components: main$/Components: main contrib/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends labwc grim wlr-randr swaybg python3-gi gir1.2-gtk-4.0 \
            libgtk4-layer-shell0 gir1.2-gtk4layershell-1.0 librsvg2-common gir1.2-gdkpixbuf-2.0 python3-gi-cairo fonts-ibm-plex fonts-noto-core fonts-noto-color-emoji \
            papirus-icon-theme adwaita-icon-theme dbus dbus-user-session libglib2.0-bin libnotify-bin thunar mousepad imv pavucontrol gnome-disk-utility \
            shared-mime-info hicolor-icon-theme python3-xxhash pciutils \
            gir1.2-webkit-6.0 gstreamer1.0-plugins-good libgl1-mesa-dri ca-certificates desktop-file-utils gtk-update-icon-cache qrencode curl python3-serial wtype python3-pil fonts-dejavu-core zip foot gir1.2-manette-0.2 network-manager iputils-ping iproute2 7zip unar wlrctl ffmpeg ffmpegthumbnailer libimage-exiftool-perl poppler-utils mpv tesseract-ocr tesseract-ocr-fra python3-dateutil socat python3-venv python3-pykeepass restic espeak-ng python3-pip unzip fdisk e2fsprogs >/dev/null
          pip3 install -q --break-system-packages vosk >/dev/null 2>&1 || true
          mkdir -p /usr/share/vosk && curl -fsSL --retry 3 -o /tmp/v.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip && unzip -q /tmp/v.zip -d /tmp/v && mv /tmp/v/vosk-model-small-fr-0.22 /usr/share/vosk/fr || true
      - name: Installation des fichiers XIII
        run: |
          cp -a config/includes.chroot/. /
          cp -a /etc/skel/. /root/
          rm -f /root/.config/labwc/autostart
          gtk-update-icon-cache -f /usr/share/icons/XIII || true
          fc-cache -f >/dev/null 2>&1 || true
          printf '[Desktop Entry]\nName=Firefox ESR\nExec=true\nIcon=firefox-esr\nType=Application\nCategories=Network;WebBrowser;\n' > /usr/share/applications/firefox-esr.desktop
          printf '[Desktop Entry]\nName=mpv\nExec=true\nIcon=mpv\nType=Application\nCategories=AudioVideo;Video;\n' > /usr/share/applications/mpv.desktop
          printf '[Desktop Entry]\nName=Claude\nExec=true\nIcon=claude-desktop\nType=Application\nCategories=Utility;Development;\n' > /usr/share/applications/com.anthropic.Claude.desktop
          python3 /usr/lib/xiii/xiii/suite_prep.py /usr/share/xiii/suite /usr/share/applications /usr/share/icons/hicolor/scalable/apps | tail -3
          update-mime-database /usr/share/mime; update-desktop-database /usr/share/applications || true; gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          python3 /usr/lib/xiii/xiii/ascii_boot.py /usr/share/plymouth/themes > /dev/null
          mkdir -p /out
      - name: Captures
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p -m 700 $XDG_RUNTIME_DIR
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 HOME=/root XIII_DEMO=1 LANG=C.UTF-8
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          chmod +x tests/zz.sh
          timeout 2400 dbus-run-session -- labwc -s tests/zz.sh > /out/labwc.log 2>&1 || true
          ls -la /out
      - name: Tests visuels (comparaison avec la vérification précédente)
        if: always()
        run: |
          apt-get install -y -qq git >/dev/null
          git clone -q --depth 1 -b zz "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /prec 2>/dev/null || true
          python3 tests/comparer.py /prec /out || true
          cat /out/regressions.txt | head -40
      - name: Publier les captures (branche zz)
        if: always()
        run: |
          cd /out && git init -q -b zz && git config user.name "CI XIII" && git config user.email "ci@xiii.local"
          git add -A && git commit -qm "Vérification ZZ $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" zz
