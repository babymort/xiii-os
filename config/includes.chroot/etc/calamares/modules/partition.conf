# OS XIII — partitionnement : « Effacer le disque » proposé d'office, partition EFI acceptée dès 32 Mo
# (une partition EFI existante de Windows ou d'une installation précédente est réutilisée sans blocage)
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI
userSwapChoices:
    - none
    - small
    - file
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
