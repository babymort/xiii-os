# OS XIII — partitionnement : « Effacer le disque » proposé d'office, partition EFI acceptée dès 32 Mo
# Btrfs par défaut : instantanés du système et retour arrière depuis le menu de démarrage (voir mount.conf)
# (une partition EFI existante de Windows ou d'une installation précédente est réutilisée sans blocage)
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI
userSwapChoices:
    - none
    - small
    - file
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]
# Chiffrement du disque (phase K) : case « Chiffrer le système » proposée avec « Effacer le disque ».
# LUKS1 : GRUB sait le déverrouiller (mot de passe demandé une seule fois au démarrage, la clé suit ensuite).
enableLuksAutomatedPartitioning: true
luksGeneration: luks1
