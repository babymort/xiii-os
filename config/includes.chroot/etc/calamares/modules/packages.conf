# OS XIII — après la copie, on retire les outils du mode « clé live ».
# « try_remove » : un paquet qui ne se retire pas n'arrête plus l'installation (avant : erreur 100 du gestionnaire de paquets).
backend: apt
update_db: false
update_system: false
operations:
  - try_remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-doc
      - live-config-systemd
      - live-tools
      - live-task-localisation
      - live-task-recommended
      - calamares-settings-debian
      - calamares
