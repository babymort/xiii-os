[greeter]
background=/usr/share/xiii/wallpapers/xiii-connexion.png
theme-name=XIII
icon-theme-name=XIII
cursor-theme-name=XIII-curseur
cursor-theme-size=24
font-name=IBM Plex Sans 11
default-user-image=/usr/share/xiii/logos/xiii-orange.png
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%H:%M  ·  %a %d %b
position=50%,center 50%,center
panel-position=top
round-user-image=false
xft-antialias=true
xft-rgba=rgb
