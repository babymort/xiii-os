# OS XIII — XIII Lecteur : touches (F1 : aide à l'écran)
. frame-step
, frame-back-step
RIGHT seek 1 exact
LEFT seek -1 exact
Shift+RIGHT seek 10 exact
Shift+LEFT seek -10 exact
UP add volume 5
DOWN add volume -5
l ab-loop
L cycle-values loop-file "inf" "no"
SPACE cycle pause
k cycle pause
j seek -5 exact
J add speed -0.25
K set speed 1
[ multiply speed 1/1.1
] multiply speed 1.1
w script-binding xiii/waveform
v script-binding xiii/vectorscope
h script-binding xiii/histogramme
t script-binding xiii/timecode
z script-binding xiii/zebra
F1 script-binding xiii/aide
s cycle sub
S cycle sub-visibility
a cycle audio
i script-binding stats/display-stats-toggle
p screenshot video
f cycle fullscreen
ESC set fullscreen no
m cycle mute
q quit
c script-binding xiii/carte_studio
