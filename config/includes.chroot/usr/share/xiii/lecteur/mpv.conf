# OS XIII — XIII Lecteur (mpv) : réglages du lecteur pro
title=XIII Lecteur — ${filename}
keep-open=yes
hr-seek=yes
hr-seek-framedrop=no
save-position-on-quit=no
osd-font="IBM Plex Sans"
osd-font-size=30
osd-color="#EEE9E3"
osd-border-color="#1A1612"
osd-border-size=2
osd-bar-align-y=0.92
sub-font="IBM Plex Sans"
sub-font-size=44
sub-auto=fuzzy
slang=fr,fre,fra,en,eng
alang=fr,fre,fra,en,eng
screenshot-format=png
screenshot-directory=~/Images/Captures
screenshot-template="%F-%wH%wM%wS%wT"
script-opts-append=osc-seekbarstyle=bar
script-opts-append=osc-boxalpha=40
script-opts-append=osc-timetotal=yes
script-opts-append=osc-hidetimeout=1500
volume-max=150
